{% extends "base.html" %}

{% block title %}Quản trị hệ thống - Admin Dashboard{% endblock %}

{% block content %}
<style>
  .admin-wrapper {
    display: flex;
    min-height: calc(100vh - 120px);
    background-color: #f8fafc;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
    margin: 20px 0;
  }

  .admin-sidebar {
    width: 260px;
    background-color: #1e293b;
    color: #fff;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .admin-brand {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding-bottom: 20px;
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    color: #38bdf8;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .admin-nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-grow: 1;
  }

  .admin-nav a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    color: #94a3b8;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 500;
    transition: all 0.2s ease;
  }

  .admin-nav a:hover {
    background-color: rgba(255, 255, 255, 0.08);
    color: #f8fafc;
    transform: translateX(4px);
  }

  /* Đánh dấu mục đang mở */
  .admin-nav a.active {
    background-color: #0284c7;
    color: #ffffff;
    font-weight: 600;
  }

  .admin-footer-nav {
    padding-top: 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }

  .admin-footer-nav a {
    color: #cbd5e1;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 8px;
    text-decoration: none;
    transition: background-color 0.2s ease;
  }

  .admin-footer-nav a:hover {
    background-color: rgba(255, 255, 255, 0.1);
    color: #fff;
  }

  .admin-content {
    flex-grow: 1;
    padding: 28px 32px;
    background-color: #ffffff;
    overflow-y: auto;
  }

  @media (max-width: 992px) {
    .admin-wrapper {
      flex-direction: column;
    }
    .admin-sidebar {
      width: 100%;
    }
    .admin-content {
      padding: 20px;
    }
  }
</style>

<div class="container-fluid px-3">
  <div class="admin-wrapper">
    <!-- Thanh điều hướng Admin (Sidebar) -->
    <aside class="admin-sidebar">
      <div class="admin-brand">
        <span>⚙️</span> ADMIN PANEL
      </div>

      <nav class="admin-nav">
        <a href="{{ url_for('admin_dashboard') }}" 
           class="{% if request.endpoint == 'admin_dashboard' %}active{% endif %}">
          <span>📊</span> Dashboard
        </a>
        <a href="{{ url_for('admin_products') }}" 
           class="{% if request.endpoint == 'admin_products' %}active{% endif %}">
          <span>📦</span> Quản lý sản phẩm
        </a>
        <a href="{{ url_for('admin_orders') }}" 
           class="{% if request.endpoint == 'admin_orders' %}active{% endif %}">
          <span>📑</span> Quản lý đơn hàng
        </a>
        <a href="{{ url_for('admin_customers') }}" 
           class="{% if request.endpoint == 'admin_customers' %}active{% endif %}">
          <span>👥</span> Quản lý khách hàng
        </a>
      </nav>

      <div class="admin-footer-nav">
        <a href="{{ url_for('home') }}">
          <span>←</span> Về website bán hàng
        </a>
      </div>
    </aside>

    <!-- Khu vực hiển thị nội dung từng trang con -->
    <main class="admin-content">
      {% block admin_content %}{% endblock %}
    </main>
  </div>
</div>
{% endblock %}
