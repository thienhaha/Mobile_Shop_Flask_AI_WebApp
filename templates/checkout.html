{% extends "base.html" %}
{% block title %}Đặt hàng{% endblock %}
{% block content %}
<div class="container page"><h1>📦 Đặt hàng</h1>
<div class="checkout-layout"><form class="panel" method="post">
<h2>Thông tin nhận hàng</h2>
<label>Họ tên<input name="receiver_name" value="{{ current_user.full_name }}" required></label>
<label>Số điện thoại<input name="phone" value="{{ current_user.phone or '' }}" required></label>
<label>Địa chỉ<input name="address" required></label>
<label>Thanh toán<select name="payment_method"><option value="COD">Thanh toán khi nhận hàng (COD)</option><option value="BANK">Chuyển khoản</option></select></label>
<button class="btn primary full">Xác nhận đặt hàng</button></form>
<aside class="summary"><h2>Đơn hàng</h2>{% for p, qty, subtotal in items %}<p>{{ p.name }} × {{ qty }} <strong>{{ "{:,.0f}".format(subtotal) }}đ</strong></p>{% endfor %}<hr><h2>{{ "{:,.0f}".format(total) }}đ</h2></aside></div>
</div>
{% endblock %}
